name: 🧪 BrowserStack lifetime quota and phone capability

# Names the mode or label, so a pending account run can be told from diagnostics
# before dispatching (docs/offline.md#dispatching-browserstack-runs).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('BrowserStack {0}', inputs.mode) ||
  github.event_name == 'schedule' && 'BrowserStack monthly safari-acceptance' ||
  format('BrowserStack {0}: {1}', github.event.label.name, github.event.pull_request.title) }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Report quota, run one phone capability or authored acceptance scope, or read completed-session logs
        type: choice
        default: quota
        options:
          [
            quota,
            capability,
            chrome-diagnostic,
            safari-acceptance,
            chrome-acceptance,
            chrome-tab-acceptance,
            firefox-tab-acceptance,
            safari-tab-acceptance,
            diagnostics,
          ]
      session_id:
        description: Completed session for diagnostics; defaults to the retained Chrome attempt 8
        type: string
        required: false
  schedule:
    # Monthly main runs Safari authored installed-context acceptance as optional
    # monitoring; phone runs are not an acceptance requirement (owner, 2026-11-02).
    # The report retains unobserved Chrome/Firefox and ordinary-tab coverage.
    - cron: '17 9 1 * *'
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  # Admission, execution and reconciliation share one account-wide lock.
  # A fork PR, or a label no job routes on, runs nothing, so it gets its own group.
  # Diagnostics only read a completed session, so they queue among themselves.
  # Neither can displace a pending account run. Every other event takes the lock.
  # Folded to one line: no-op group, then diagnostics, then the account lock.
  group: >-
    ${{ github.event_name == 'pull_request' &&
    (github.event.pull_request.head.repo.full_name != github.repository ||
    !contains(fromJSON('["ci-browserstack-logs","ci-real-devices","ci-real-devices-chrome","ci-real-devices-safari","ci-real-devices-chrome-acceptance","ci-real-devices-chrome-tab","ci-real-devices-firefox-tab","ci-real-devices-safari-tab"]'), github.event.label.name)) &&
    format('browserstack-noop-{0}', github.run_id) ||
    (inputs.mode == 'diagnostics' || github.event.label.name == 'ci-browserstack-logs') &&
    'browserstack-diagnostics' ||
    'browserstack-lifetime-account' }}
  cancel-in-progress: false

env:
  # Authored scopes reserve, build with sync evidence and get the longer wrapper.
  BS_AUTHORED_SCOPES: '["safari-acceptance","chrome-acceptance","chrome-tab-acceptance","firefox-tab-acceptance","safari-tab-acceptance"]'

jobs:
  diagnostics:
    name: Read-only completed-session diagnostics
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostics') ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ci-browserstack-logs' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Completed Chrome session from capability run 41395124342, attempt 1.
      BS_DIAGNOSTIC_SESSION: ${{ inputs.session_id || 'dc1a30f87ce096c3e7ae42bae0fd3349bc24d9ad' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Read and sanitize completed-session diagnostics
        timeout-minutes: 3
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
        run: node scripts/ci/browserstack-session-diagnostics.ts
      - name: Retain sanitized completed-session diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-session-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browserstack-session-diagnostics.json
          if-no-files-found: error
          retention-days: 14

  accounting:
    name: BrowserStack quota admission and report
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'diagnostics') ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      contains(fromJSON('["ci-real-devices","ci-real-devices-chrome","ci-real-devices-safari","ci-real-devices-chrome-acceptance","ci-real-devices-chrome-tab","ci-real-devices-firefox-tab","ci-real-devices-safari-tab"]'), github.event.label.name) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Read-only run listing reports runs displaced before they started.
      actions: read
      contents: write
    outputs:
      allocation_allowed: ${{ steps.accounting.outputs.allocation_allowed }}
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Read usage and commit estimated admission before any device or Local
        id: accounting
        continue-on-error: true
        timeout-minutes: 3
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BS_OPERATION: ${{ (github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.mode == 'capability' || inputs.mode == 'chrome-diagnostic' || contains(fromJSON(env.BS_AUTHORED_SCOPES), inputs.mode)) && 'reserve' || 'quota' }}
        run: node scripts/ci/browserstack-accounting.ts "$BS_OPERATION"
      - name: Retain admission and assumption evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-accounting-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browserstack-admission.*
          if-no-files-found: error
          retention-days: 14
      - name: Keep insufficient or invalid estimated admission visibly failing
        if: always()
        env:
          ACCOUNTING_OUTCOME: ${{ steps.accounting.outcome }}
        run: test "$ACCOUNTING_OUTCOME" = success

  capability:
    name: Selected phone capability or acceptance with disposable CI HTTPS
    needs: accounting
    if: >-
      needs.accounting.result == 'success' &&
      needs.accounting.outputs.allocation_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Every scope retains the same admission, execution, cleanup and reconciliation.
      BS_CAPABILITY_SCOPE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.mode == 'chrome-diagnostic') || (github.event_name == 'pull_request' && github.event.label.name == 'ci-real-devices-chrome')) && 'chrome-navigation-diagnostic' || (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'safari-acceptance') || (github.event_name == 'pull_request' && github.event.label.name == 'ci-real-devices-safari')) && 'safari-acceptance' || ((github.event_name == 'workflow_dispatch' && inputs.mode == 'chrome-acceptance') || (github.event_name == 'pull_request' && github.event.label.name == 'ci-real-devices-chrome-acceptance')) && 'chrome-acceptance' || ((github.event_name == 'workflow_dispatch' && inputs.mode == 'chrome-tab-acceptance') || (github.event_name == 'pull_request' && github.event.label.name == 'ci-real-devices-chrome-tab')) && 'chrome-tab-acceptance' || ((github.event_name == 'workflow_dispatch' && inputs.mode == 'firefox-tab-acceptance') || (github.event_name == 'pull_request' && github.event.label.name == 'ci-real-devices-firefox-tab')) && 'firefox-tab-acceptance' || ((github.event_name == 'workflow_dispatch' && inputs.mode == 'safari-tab-acceptance') || (github.event_name == 'pull_request' && github.event.label.name == 'ci-real-devices-safari-tab')) && 'safari-tab-acceptance' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browserstack-accounting-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Verify reservation and retain a zero-allocation receipt before build/setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/browserstack-capability.ts prepare
      - name: Install the production fixture dependencies
        run: npm ci
      - name: Check application and fixture types before paid execution
        run: npm run typecheck
      - name: Build the production application
        env:
          # Native model reads are observation-only and absent from ordinary builds.
          VITE_SYNC_EVIDENCE: ${{ contains(fromJSON(env.BS_AUTHORED_SCOPES), env.BS_CAPABILITY_SCOPE) && '1' || '0' }}
        run: npm run build
      - name: Configure BrowserStack
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        with:
          username: ${{ secrets.BS_USERNAME }}
          access-key: ${{ secrets.BS_ACCESS_KEY }}
      - name: Start private Local tunnel
        id: tunnel
        timeout-minutes: 3
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        with:
          local-testing: start
          local-identifier: random
          local-logging-level: 'false'
          local-args: --force-local --timeout 5
      - name: Observe the selected bounded physical-phone scope
        # Every authored scope adds the journey and unpaid fixture startup/teardown.
        # Each selected device still has the same 780s operational bound + cleanup.
        timeout-minutes: ${{ contains(fromJSON(env.BS_AUTHORED_SCOPES), env.BS_CAPABILITY_SCOPE) && 18 || 14 }}
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/browserstack-capability.ts run
      - name: Stop Local tunnel
        if: always() && (steps.tunnel.outcome == 'success' || steps.tunnel.outcome == 'failure' || steps.tunnel.outcome == 'cancelled')
        timeout-minutes: 2
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        with:
          local-testing: stop
      - name: Retain device observations and allocation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/browserstack-capability.json
            artifacts/browserstack-capability/
          if-no-files-found: error
          retention-days: 14

  reconciliation:
    name: Reconcile every capability attempt against lifetime usage
    needs: [accounting, capability]
    if: always() && needs.accounting.outputs.allocation_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Read receipt if the device job retained one
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browserstack-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Preserve actual usage and reconcile or retain the hold
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/browserstack-accounting.ts reconcile
      - name: Retain post-run accounting
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browserstack-reconciliation.*
          if-no-files-found: error
          retention-days: 14

name: 🧪 BrowserStack infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only quota evidence or explicitly allocate the existing device smoke
        type: choice
        default: quota
        options: [quota, smoke]
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: browserstack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quota:
    name: BrowserStack read-only quota evidence
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'quota'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Read Plan and six retained session records (no devices or Local)
        timeout-minutes: 2
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
        run: node scripts/ci/browserstack.ts quota
      - name: Retain allowlisted read-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-quota-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browserstack-quota.json
          if-no-files-found: error
          retention-days: 14
  smoke:
    name: BrowserStack credentials and mobile tunnel
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'smoke') ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ci-real-devices' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify credentials and select real phones
        timeout-minutes: 2
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
        run: node scripts/ci/browserstack.ts credentials
      - name: Configure BrowserStack
        uses: browserstack/github-actions/setup-env@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        with:
          username: ${{ secrets.BS_USERNAME }}
          access-key: ${{ secrets.BS_ACCESS_KEY }}
      - name: Start Local tunnel
        id: tunnel
        timeout-minutes: 3
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        with:
          local-testing: start
          local-identifier: random
          local-logging-level: 'false'
          local-args: --force-local --timeout 5
      - name: Real Android Chrome, Firefox and iPhone Safari smoke
        timeout-minutes: 12
        env:
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESS_KEY: ${{ secrets.BS_ACCESS_KEY }}
        run: node scripts/ci/browserstack.ts smoke
      - name: Stop Local tunnel
        if: always() && (steps.tunnel.outcome == 'success' || steps.tunnel.outcome == 'failure' || steps.tunnel.outcome == 'cancelled')
        timeout-minutes: 2
        uses: browserstack/github-actions/setup-local@1fad39ae4755588f7fc6854da6c3efba2bf5d08f
        with:
          local-testing: stop
      - name: Retain redacted probe results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browserstack-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browserstack-*.json
          if-no-files-found: warn
          retention-days: 14

name: 💻 Desktop offline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/desktop-offline.yml
      - scripts/ci/desktop-*.ts
      - web/offline/**
      - docs/todo/SPN-052.md
      - docs/implementation/SPN-052.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-probe:
    name: Native Safari profile capability
    runs-on: macos-26
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prove same-profile ordinary Safari restart
        run: node scripts/ci/desktop-profile-probe.ts
      - name: Retain profile proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/desktop-offline/
          if-no-files-found: error
          retention-days: 14

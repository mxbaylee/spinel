name: 💎 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A running push to main is never cancelled: Lib tests diffs each push against
  # the one before it, so a cancelled run would leave that push's lib changes
  # untested on main. A newer push can still replace one that is only pending;
  # that push's changes were already tested on its up-to-date PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: changes
        run: node scripts/ci/changes.ts

  backlog:
    name: Backlog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Tickets and index
        run: npm run backlog:check

  pull-request:
    name: Pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Title and branch go through env, never into the script text.
      - name: Title, ticket, IDs and size
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/backlog/cli.ts pr --base "origin/$BASE_REF" --title "$PR_TITLE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - name: Typecheck
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run typecheck
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Not applicable — only allowlisted documentation changed; Backlog and Lint still run.'

  unit-tests:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      # lib/ runs in its own job below.
      - name: Unit tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm test -- --exclude 'lib/**'
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Not applicable — only allowlisted documentation changed; Backlog and Lint still run.'

  # lib/'s seeded fuzz runs about 5 minutes on a laptop, serially (maxWorkers:
  # 1), so it gets its own job and time. The job always runs, since the ruleset
  # requires its check, but passes at once when nothing it tests changed.
  # Owner, chat 2026-10-22.
  lib-tests:
    name: Lib tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE//0/}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null ||
            ! git diff --quiet "$BASE" HEAD -- lib scripts/dependencies package.json \
              package-lock.json vitest.config.ts tsconfig.json .nvmrc .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing lib/ depends on changed since $BASE."
          fi
      - if: steps.changes.outputs.run
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        if: steps.changes.outputs.run
        run: npm ci
      - name: Lib tests
        if: steps.changes.outputs.run
        # A path filter: it selects every test whose path holds "lib/", which
        # today is only lib/, the same set the unit job excludes.
        run: npx vitest run lib/

  playwright-run:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Playwright smoke (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # Each runner keeps one browser worker and only its own app server, as
    # `npm run e2e` does; the builds and their shards run side by side instead
    # of one after another.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: development, shard: 1/2 }
          - { project: development, shard: 2/2 }
          - { project: production, shard: 1/2 }
          - { project: production, shard: 2/2 }
          - { project: mobile-https, shard: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Playwright smoke
        env:
          SPINEL_E2E_PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --project="$SPINEL_E2E_PROJECT" ${SHARD:+--shard="$SHARD"}
      - name: Artifact name
        if: always()
        id: artifact
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: echo "name=theme-screenshots-$PROJECT${SHARD:+-${SHARD%/*}}" >> "$GITHUB_OUTPUT"
      - name: Theme screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            test-results/theme-screenshots/*.png
            test-results/**/test-failed-*.png
            test-results/**/*-restore-preview.png
            test-results/**/*-export.pdf
            test-results/**/*-export-opened.png
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: warn

  # The ruleset requires a check named "Playwright smoke", so this job carries
  # the name. Only classified docs-only changes may omit the browser matrix.
  playwright:
    name: Playwright smoke
    needs: [changes, playwright-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required browser validation
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RESULT: ${{ needs.playwright-run.result }}
        run: |
          test "$CLASSIFICATION" = success
          if [ "$DOCS_ONLY" = true ] && [ "$RESULT" = skipped ]; then
            echo 'Not applicable — only allowlisted documentation changed; Backlog and Lint still run.'
          else
            echo "Playwright runs: $RESULT"
            test "$RESULT" = success
          fi

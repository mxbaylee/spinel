name: SPN-135 one unsampled candidate prefix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SYNC_EVIDENCE: '0'
      VITE_DOC_SELECTION_EVIDENCE: '0'
      VITE_DOC_RESPONSIVENESS_EVIDENCE: '1'
      SPINEL_E2E_PROJECT: doc-responsiveness
      SPN108_BASELINE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dbbe5ccaf085ce20b79068d3596a35dcf2142223
          path: runtime-source
          persist-credentials: false
      - name: Retain source and runner identity
        run: |
          git rev-parse HEAD > diagnostic-helper-source.txt
          git -C runtime-source rev-parse HEAD HEAD^{tree} > diagnostic-runtime-source.txt
          test "$(git -C runtime-source rev-parse HEAD)" = dbbe5ccaf085ce20b79068d3596a35dcf2142223
          test "$(git -C runtime-source rev-parse HEAD^{tree})" = 45abc48cdb93347a62f514da4773ea7ff5521935
          test -z "$(git -C runtime-source status --porcelain)"
          cat /etc/apt/apt-mirrors.txt > diagnostic-mirror-profile.txt
      - name: Install original runtime and browser with reviewed setup helper
        timeout-minutes: 8
        working-directory: runtime-source
        run: |
          npm ci --no-audit
          node ../scripts/ci/prefer-ubuntu-archive.ts
          npx playwright install --with-deps chromium
      - name: Prepare declared diagnostic overlay
        run: node scripts/ci/spn135-phase-diagnostic.ts runtime-source
      - name: Build original application with diagnostic source maps
        timeout-minutes: 4
        working-directory: runtime-source
        run: npm run build -- --sourcemap
      - name: Verify the exact two-case selection without running browsers
        working-directory: runtime-source
        run: |
          npx playwright test --project=doc-responsiveness e2e/doc-responsiveness.spec.ts --grep 'desktop sustained native typing plain-[12]$' --workers=1 --retries=0 --max-failures=1 --list --reporter=json > spn135-collected.json
          node ../scripts/ci/spn135-selection.ts spn135-collected.json
      - name: One unsampled candidate prefix with unchanged assertions; stop on first failure
        timeout-minutes: 12
        run: node scripts/ci/spn135-run.ts runtime-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 3
        with:
          name: spn135-unsampled-candidate-prefix
          retention-days: 14
          if-no-files-found: error
          path: |
            diagnostic-*.txt
            runtime-source/spn135-*.json
            runtime-source/spn135-*.patch
            runtime-source/spn135-*.log
            runtime-source/e2e/spn135-trace.ts
            runtime-source/e2e/spn135-unsampled.ts
            runtime-source/test-results/**/spn108-*.json
            runtime-source/test-results/**/spn108-profile.cpuprofile
            runtime-source/test-results/**/spn135-*.json
            runtime-source/test-results/**/error-context.md
            runtime-source/test-results/**/test-failed-*.png
            runtime-source/playwright-report/*.json
            runtime-source/dist/assets/*.js
            runtime-source/dist/assets/*.map

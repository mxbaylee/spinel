name: 💎 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backlog:
    name: Backlog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Tickets and index
        run: npm run backlog:check

  pull-request:
    name: Pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Title and branch go through env, never into the script text.
      - name: Title, ticket, IDs and size
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/backlog/cli.ts pr --base "origin/$BASE_REF" --title "$PR_TITLE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test

  playwright-run:
    name: Playwright smoke (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # Each runner keeps one browser worker and only its own app server, as
    # `npm run e2e` does; the builds and their shards run side by side instead
    # of one after another.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: development, shard: 1/2 }
          - { project: development, shard: 2/2 }
          - { project: production, shard: 1/2 }
          - { project: production, shard: 2/2 }
          - { project: mobile-https, shard: '' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Playwright smoke
        env:
          SPINEL_E2E_PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --project="$SPINEL_E2E_PROJECT" ${SHARD:+--shard="$SHARD"}
      - name: Artifact name
        if: always()
        id: artifact
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
        run: echo "name=theme-screenshots-$PROJECT${SHARD:+-${SHARD%/*}}" >> "$GITHUB_OUTPUT"
      - name: Theme screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            test-results/theme-screenshots/*.png
            test-results/**/test-failed-*.png
            test-results/**/*-restore-preview.png
            test-results/**/*-export.pdf
            test-results/**/*-export-opened.png
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: warn

  # The ruleset requires a check named "Playwright smoke", so this job carries
  # the name and passes only when every run above passed.
  playwright:
    name: Playwright smoke
    needs: playwright-run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every build passed
        env:
          RESULT: ${{ needs.playwright-run.result }}
        run: |
          echo "Playwright runs: $RESULT"
          test "$RESULT" = success

# Opt-in SPN-146 attribution experiment; not a required gate and may be removed
# once the mobile Doc typing flush-tail question is answered. On one hosted
# runner it alternates the previously installed Docs build (previous) with this
# PR's build (patched), everything else identical, and tabulates the flush tail.
# Rerun: remove, then re-add, the ci-patch-ab label (each cycle adds PAIRS pairs). Each label event also
# starts a full ci.yml run (its types include labeled and unlabeled), so a cycle costs two extra CI runs.
# Runtime: about 3 minutes per variant run (build and test), so PAIRS=8 (16 runs) took about 47 minutes in
# run 42320780806; the 120-minute step timeout and 130-minute job timeout leave room for slow runners.
# Cycles queue (no cancel-in-progress).
# Stress levels: label ci-patch-ab runs the normal 4x mobile CPU throttle; ci-patch-ab-6x and
# ci-patch-ab-8x run 6x and 8x (SPN146_AB_CPU_THROTTLE), to check whether the old build's tail grows with
# the load while the patched build's does not. Never pool results across throttle levels.
# ci-patch-ab-stress keeps the 4x throttle and runs half the CPUs' worth of busy-loop processes beside the test, which
# pushes the runner into its slow regime on demand (the regime of the only observed breaches).
# ci-patch-ab-profile is the stress load plus the spec's CPU-profile sample, for attributing a slow flush.
# ci-patch-ab-gc is the stress load with a light V8 GC trace (no profiler) matched to each flush.
# ci-patch-ab-heap is the stress load with V8 allocation sampling (odd pairs: all allocations; even: live only).
# ci-patch-ab-semispace is the stress load with the GC trace; odd pairs run with a 64 MB young generation.
# The 8x level is best effort: a cycle can time out on every run (it stops after four in a row).
# Within each pair the order swaps every other pair (odd: previous first; even: patched first).
# `previous` is generation qualifiedRangesPatched in scripts/ci/patch-ab/toggle.ts.
name: 🔬 SPN-146 Docs patch A/B

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: patch-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch-ab:
    name: Alternating previous/patched mobile typing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      contains(fromJSON('["ci-patch-ab","ci-patch-ab-6x","ci-patch-ab-8x","ci-patch-ab-stress","ci-patch-ab-profile","ci-patch-ab-gc","ci-patch-ab-heap","ci-patch-ab-semispace"]'), github.event.label.name) &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      VITE_SYNC_EVIDENCE: '0'
      VITE_DOC_SELECTION_EVIDENCE: '0'
      VITE_DOC_RESPONSIVENESS_EVIDENCE: '1'
      SPINEL_E2E_PROJECT: doc-responsiveness
      SPN108_BASELINE: '0'
      PAIRS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Choose CPU throttle from the label
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          case "$LABEL" in
            ci-patch-ab-6x) rate=6 ;;
            ci-patch-ab-8x) rate=8 ;;
            *) rate=4 ;;
          esac
          echo "SPN146_AB_CPU_THROTTLE=$rate" >> "$GITHUB_ENV"
          if [ "$LABEL" = ci-patch-ab-stress ] || [ "$LABEL" = ci-patch-ab-profile ] || [ "$LABEL" = ci-patch-ab-gc ] || [ "$LABEL" = ci-patch-ab-heap ] || [ "$LABEL" = ci-patch-ab-semispace ]; then echo "STRESS_PROCESSES=$(( ($(nproc) + 1) / 2 ))" >> "$GITHUB_ENV"; fi
          # The profile label runs the spec's own CPU-profile sample (1 ms sampling, budgets not enforced) so a
          # slow flush can be attributed; its profiles are kept beside each run. Never pool it with plain-1 runs.
          if [ "$LABEL" = ci-patch-ab-profile ]; then echo "SAMPLE=profile" >> "$GITHUB_ENV"; fi
          # The gc label keeps the unprofiled plain-1 sample under the same stress and adds a light V8 GC trace,
          # matched to each flush in the metrics (gcTrace), so GC pauses can be counted without profiler overhead.
          if [ "$LABEL" = ci-patch-ab-gc ]; then echo "SPN146_GC_TRACE=1" >> "$GITHUB_ENV"; fi
          # The heap label samples V8 allocations over the typing run: odd pairs sample every allocation (churn),
          # even pairs only what is still live at the end (retention), each with both builds.
          if [ "$LABEL" = ci-patch-ab-heap ]; then echo "HEAP_AB=1" >> "$GITHUB_ENV"; fi
          # The semispace label records the GC trace and gives odd pairs a 64 MB young generation (V8 flags),
          # even pairs the default, so the effect is compared inside one run, with both builds in each.
          if [ "$LABEL" = ci-patch-ab-semispace ]; then echo "SEMISPACE_AB=1" >> "$GITHUB_ENV"; echo "SPN146_GC_TRACE=1" >> "$GITHUB_ENV"; fi
      - name: Install candidate
        run: npm ci
      - name: Install Chromium
        run: |
          node scripts/ci/prefer-ubuntu-archive.ts
          npx playwright install --with-deps chromium
      # A failing sample is recorded, not fatal: the point is to observe both
      # variants. A bad toggle or build still stops the job (harness problem).
      - name: Alternate previous and patched
        timeout-minutes: 120
        run: |
          seq=0; unmeasured=0
          for pair in $(seq 1 "$PAIRS"); do
            # Swap the order every other pair so neither build always runs first.
            if (( pair % 2 == 0 )); then variants="patched previous"; else variants="previous patched"; fi
            for variant in $variants; do
              run="patch-ab/runs/pair-$pair-$variant"
              mkdir -p "$run"
              seq=$((seq + 1))
              echo "$seq" > "$run/seq"
              node scripts/ci/patch-ab/toggle.ts "$variant" "$run/installed.json"
              npm run build
              rm -rf test-results
              stress_pids=()
              for _ in $(seq 1 "${STRESS_PROCESSES:-0}"); do
                (while :; do :; done) & stress_pids+=($!)
              done
              code=0
              if [ -n "${HEAP_AB:-}" ]; then
                if (( pair % 2 == 1 )); then export SPN146_HEAP_SAMPLE=all; else export SPN146_HEAP_SAMPLE=live; fi
              fi
              if [ -n "${SEMISPACE_AB:-}" ]; then
                if (( pair % 2 == 1 )); then export SPN146_AB_V8_FLAGS="--min-semi-space-size=64 --max-semi-space-size=64"; else unset SPN146_AB_V8_FLAGS; fi
              fi
              npx playwright test --project=doc-responsiveness \
                --grep "mobile sustained native typing ${SAMPLE:-plain-1}" || code=$?
              for pid in "${stress_pids[@]}"; do kill "$pid" 2>/dev/null || true; done
              echo "$code" > "$run/exit-code"
              # Profile samples leave a CPU profile and its clock bracket; keep them compressed with the run.
              find test-results \( -name 'spn108-profile*' -o -name 'spn146-heap-sampling.json' \) | while read -r f; do gzip -c "$f" > "$run/$(basename "$f").gz"; done
              metrics=$(find test-results -name spn108-metrics.json | head -n 1)
              # A run that timed out leaves a partial metrics file with no summary; it counts as unmeasured.
              if [ -n "$metrics" ] && jq -e '.summary' "$metrics" >/dev/null 2>&1; then
                cp "$metrics" "$run/metrics.json"; unmeasured=0
              else
                unmeasured=$((unmeasured + 1))
              fi
              # Four runs in a row with no metrics (every run timed out) is a runner that cannot finish
              # this load; stop the cycle instead of spending the remaining runs on nothing.
              if (( unmeasured >= 4 )); then echo "Stopping: $unmeasured consecutive runs produced no metrics."; break 2; fi
            done
          done
      - name: Summarize
        if: always()
        run: PAIRS="$PAIRS" STRESS_PROCESSES="${STRESS_PROCESSES:-0}" node scripts/ci/patch-ab/summarize.ts patch-ab/runs patch-ab/summary.json patch-ab/summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f patch-ab/summary.md ]; then cat patch-ab/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain runs and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: patch-ab/
          if-no-files-found: warn
          retention-days: 7

# Opt-in SPN-146 attribution experiment; not a required gate and may be removed
# once the mobile Doc typing flush-tail question is answered. On one hosted
# runner it alternates the previously installed Docs build (previous) with this
# PR's build (patched), everything else identical, and tabulates the flush tail.
name: 🔬 SPN-146 Docs patch A/B

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: patch-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  patch-ab:
    name: Alternating previous/patched mobile typing
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ci-patch-ab' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_SYNC_EVIDENCE: '0'
      VITE_DOC_SELECTION_EVIDENCE: '0'
      VITE_DOC_RESPONSIVENESS_EVIDENCE: '1'
      SPINEL_E2E_PROJECT: doc-responsiveness
      SPN108_BASELINE: '0'
      PAIRS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install candidate
        run: npm ci
      - name: Install Chromium
        run: |
          node scripts/ci/prefer-ubuntu-archive.ts
          npx playwright install --with-deps chromium
      # A failing sample is recorded, not fatal: the point is to observe both
      # variants. A bad toggle or build still stops the job (harness problem).
      - name: Alternate previous and patched
        timeout-minutes: 50
        run: |
          for pair in $(seq 1 "$PAIRS"); do
            for variant in previous patched; do
              run="patch-ab/runs/pair-$pair-$variant"
              mkdir -p "$run"
              node scripts/ci/patch-ab/toggle.ts "$variant" "$run/installed.json"
              npm run build
              rm -rf test-results
              code=0
              npx playwright test --project=doc-responsiveness \
                --grep "mobile sustained native typing plain-1" || code=$?
              echo "$code" > "$run/exit-code"
              metrics=$(find test-results -name spn108-metrics.json | head -n 1)
              if [ -n "$metrics" ]; then cp "$metrics" "$run/metrics.json"; fi
            done
          done
      - name: Summarize
        run: node scripts/ci/patch-ab/summarize.ts patch-ab/runs patch-ab/summary.json patch-ab/summary.md
      - name: Publish summary
        if: always()
        run: |
          if [ -f patch-ab/summary.md ]; then cat patch-ab/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain runs and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: patch-ab/
          if-no-files-found: warn
          retention-days: 7

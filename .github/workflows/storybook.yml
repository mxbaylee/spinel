name: 📚 Storybook

# Documentation-only PRs avoid rebuilding an unchanged catalogue. Main always
# publishes: a later docs push can replace a queued code push in Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  # A half-finished Pages deploy is worse than a late one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/changes.ts
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Storybook
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      # A preset that fails to load is only a warning, but without the React
      # preset no story renders, so fail on it, and on a missing manager page.
      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          npm run build-storybook 2>&1 | tee storybook-build.log
          if grep -q 'Failed to load preset' storybook-build.log; then
            echo '::error::A Storybook preset failed to load; see the log above.'
            exit 1
          fi
          for file in index.html index.json iframe.html; do
            test -s "storybook-static/$file" || { echo "::error::storybook-static/$file is missing"; exit 1; }
          done
      - name: Upload interactive review build
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-review
          path: storybook-static
          if-no-files-found: error
          retention-days: 7
      - name: Capture icon and integration stories
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          npx playwright install --with-deps chromium
          node scripts/ci/icon-screenshots.ts
      - name: Upload visual review
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entity-icon-screenshots
          path: test-results/entity-icons
          if-no-files-found: error
      - name: Capture redesign review and verify shared controls
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run screenshots
      - name: Upload redesign review
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-review
          path: test-results/design-review
          if-no-files-found: error
          retention-days: 14
      # Temporary owner-authorized PR #125 review. Remove this exception before merge.
      - name: Upload for Pages
        if: needs.changes.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 125 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/spn-047-redesign'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Not applicable — only allowlisted documentation changed; existing catalogue is unchanged.'

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 125 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/spn-047-redesign'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

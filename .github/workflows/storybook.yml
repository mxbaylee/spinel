name: 📚 Storybook

# Documentation-only PRs avoid rebuilding an unchanged catalogue. Main always
# publishes: a later docs push can replace a queued code push in Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      story_ids:
        description: 'Optional space-separated story IDs for a focused manual review (empty captures all)'
        required: false
        default: ''
        type: string
      publish_preview:
        description: 'Publish this branch to the shared Pages site (latest deployment wins)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  # A half-finished Pages deploy is worse than a late one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci/changes.ts
          else
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Storybook
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      # A preset that fails to load is only a warning, but without the React
      # preset no story renders, so fail on it, and on a missing manager page.
      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          npm run build-storybook 2>&1 | tee storybook-build.log
          if grep -q 'Failed to load preset' storybook-build.log; then
            echo '::error::A Storybook preset failed to load; see the log above.'
            exit 1
          fi
          for file in index.html index.json iframe.html; do
            test -s "storybook-static/$file" || { echo "::error::storybook-static/$file is missing"; exit 1; }
          done
      - name: Upload interactive review build
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-review
          path: storybook-static
          if-no-files-found: error
          retention-days: 7
      - name: Upload for Pages
        if: >-
          needs.changes.outputs.docs_only != 'true' &&
          ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.story_ids == '')) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'storybook-preview')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref != 'refs/heads/main'))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo 'Not applicable — only allowlisted documentation changed; existing catalogue is unchanged.'

  review_desktop:
    name: Review Storybook desktop
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Each viewport downloads the same build and keeps its complete review coverage.
    # Slow runner dependency mirrors can consume 12 minutes before this viewport's
    # extra icon suite and full catalogue start. Keep all assertions and captures.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The upstream build retains the registry audit invocation for this lockfile.
      # Keep duplicate audit requests outside the viewport budget (decision #138).
      - run: npm ci --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: storybook-review
          path: storybook-static
      - name: Capture icon and integration stories
        # This separate icon suite still runs once, including its phone captures.
        run: |
          npx playwright install --with-deps chromium
          node scripts/ci/icon-screenshots.ts
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: entity-icon-screenshots
          path: test-results/entity-icons
          if-no-files-found: error
      - name: Capture redesign review and verify shared controls
        env:
          # PR validation always covers the full catalog; only manual runs can narrow it.
          STORY_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.story_ids || '' }}
        run: |
          read -r -a stories <<< "$STORY_IDS"
          npm run screenshots -- --viewport desktop "${stories[@]}"
      - name: Upload redesign review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-review-desktop
          path: test-results/design-review
          if-no-files-found: error
          retention-days: 14

  review_tablet:
    name: Review Storybook tablet
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The upstream build retains the registry audit invocation (decision #138).
      - run: npm ci --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: storybook-review
          path: storybook-static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture redesign review and verify shared controls
        env:
          STORY_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.story_ids || '' }}
        run: |
          read -r -a stories <<< "$STORY_IDS"
          npm run screenshots -- --viewport tablet "${stories[@]}"
      - name: Upload redesign review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-review-tablet
          path: test-results/design-review
          if-no-files-found: error
          retention-days: 14

  review_mobile:
    name: Review Storybook mobile (${{ matrix.theme }})
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The upstream build retains the registry audit invocation (decision #138).
      - run: npm ci --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: storybook-review
          path: storybook-static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture redesign review and verify shared controls
        env:
          STORY_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.story_ids || '' }}
          MOBILE_THEME: ${{ matrix.theme }}
        run: |
          read -r -a stories <<< "$STORY_IDS"
          npm run screenshots -- --viewport mobile --theme "$MOBILE_THEME" "${stories[@]}"
      - name: Upload redesign review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: design-review-mobile-${{ matrix.theme }}
          path: test-results/design-review
          if-no-files-found: error
          retention-days: 14

  review:
    # Keep the stable check name while making every viewport result explicit.
    name: Review Storybook states and interactions
    needs: [changes, build, review_desktop, review_tablet, review_mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require every viewport review
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DESKTOP_RESULT: ${{ needs.review_desktop.result }}
          TABLET_RESULT: ${{ needs.review_tablet.result }}
          MOBILE_RESULT: ${{ needs.review_mobile.result }}
        run: node scripts/ci/storybook-review-gate.ts

  preview:
    name: Publish PR preview to GitHub Pages
    needs: [changes, build]
    # Preview is for owner feedback, independent of merge/visual approval gates.
    # No ownership lock: a subsequent main or preview deployment replaces it.
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'storybook-preview')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref != 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, build, review]
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.story_ids == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

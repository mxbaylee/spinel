name: SPN-129 router configuration diagnostic

on:
  push:
    branches: [codex/spn-129-router-config-diagnostic-20261104]

permissions:
  contents: read

jobs:
  configuration:
    name: Router configuration diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check required configuration presence
        id: configuration
        env:
          APP_ID_PRESENT: ${{ vars.SPINEL_CI_ROUTER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.SPINEL_CI_ROUTER_PRIVATE_KEY != '' }}
        run: |
          printf 'app_id_present=%s\nprivate_key_present=%s\n' "$APP_ID_PRESENT" "$PRIVATE_KEY_PRESENT"
          if [ "$APP_ID_PRESENT" != true ] || [ "$PRIVATE_KEY_PRESENT" != true ]; then
            echo 'Router configuration is unavailable to this repository workflow.' >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      # App ID is nonsecret and may appear in action inputs. The key and token
      # remain GitHub-masked; successful revocation needs its observed post log.
      - name: Verify the existing repository installation with a read-only token
        id: app
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.SPINEL_CI_ROUTER_APP_ID }}
          private-key: ${{ secrets.SPINEL_CI_ROUTER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: read
          skip-token-revoke: false
      - name: Confirm authenticated repository identity
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '{repository:.full_name}'

name: 🔎 Phone startup build inspection

on:
  push:
    branches: [codex/spn-090-production-integration]

permissions:
  contents: read

concurrency:
  group: phone-build-inspection
  cancel-in-progress: false

jobs:
  inspection:
    if: github.repository == 'mxbaylee/spinel' && github.event.before == '3ac03e9ecf48798aa4942aba1f1ab0fb4650c09b'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SYNC_EVIDENCE: '1'
      SPN090_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Admit only the declared first attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install exact dependencies
        run: npm ci
      - name: Inspect one new emitted phone build
        timeout-minutes: 10
        run: node scripts/ci/browserstack-build-inspection.ts
      - name: Preserve new build and complete or partial inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spn090-startup-build
          path: |
            artifacts/browserstack-build-*.json
            dist/
          if-no-files-found: error
          retention-days: 14

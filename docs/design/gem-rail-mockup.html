<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinel gem rail mockup</title>
<!--
  Reference mockup for SPN-027 (direction C, "gem rail"). No build step: React,
  Babel and Lucide load from a CDN, and Babel compiles gem-rail-mockup.tsx in the
  browser. State resets on refresh. Open it with `npm run design`, which serves
  docs/ (a file:// page can't load the .tsx or ../reference/icons/).
  SPN-027 deletes docs/design/ once the real theme and screens land.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--sp-bg); color: var(--sp-text); font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
.app { display: flex; flex-wrap: wrap; min-height: 100vh; position: relative; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.rail { flex: 0 0 64px; background: var(--sp-rail); color: var(--sp-rail-ink); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; }
/* Pinned to the window, so the theme and profile buttons stay in view on long pages. */
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; box-sizing: border-box; z-index: 20; }
.rail .logo { margin-bottom: 10px; }
/* The wiggle is on an inner span: .gem's own transform is the dark-theme flip,
   and turning the button would turn its label too. */
.logo .wiggle { display: flex; }
.logo:hover .wiggle, .logo:focus-visible .wiggle { animation: wiggle 0.6s ease-in-out; }
@keyframes wiggle { 20% { transform: rotate(-12deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .logo .wiggle { animation: none !important; } }
.rb { position: relative; width: 44px; height: 44px; border: 0; border-radius: 6px; background: transparent; color: var(--sp-rail-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.rb.on { background: var(--sp-rail-ink); color: var(--sp-rail); }
/* Rail labels: shown on hover and keyboard focus, floating over the page so nothing moves. */
.rb[data-tip]::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translate(-4px, -50%); background: var(--sp-text); color: var(--sp-bg); font-size: 13px; font-weight: 700; white-space: nowrap; padding: 6px 10px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.12s, transform 0.12s; z-index: 30; }
.rb[data-tip]:hover::after, .rb[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.grow { flex: 1; }
.main { flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
.main.sheet { padding: 16px 20px; gap: 10px; height: 100vh; }
h1 { margin: 0; font-size: 26px; font-weight: 700; }
.btn { border: 1px solid var(--sp-border); background: var(--sp-panel); border-radius: 6px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.btn.pri { background: var(--sp-accent); border-color: var(--sp-accent); color: var(--sp-on-accent); font-weight: 700; }
.btn.sq { width: 40px; padding: 0; justify-content: center; }
.btn[aria-pressed="true"] { background: var(--sp-tint-1); border-color: var(--sp-accent); }
.chip { border: 1px solid var(--sp-border); background: transparent; border-radius: 6px; padding: 0 12px; min-height: 36px; cursor: pointer; color: var(--sp-muted); }
.chip.on { background: var(--sp-accent); border-color: var(--sp-accent); color: var(--sp-on-accent); }
.inp { border: 1px solid var(--sp-border); background: var(--sp-panel); border-radius: 6px; min-height: 40px; padding: 0 12px; }
:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: 1px; }
.mu { color: var(--sp-muted); }
.small { font-size: 13px; }
.label { font-size: 13px; font-weight: 700; color: var(--sp-muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tile { flex: 1 1 220px; border: 0; border-top: 4px solid var(--sp-accent); border-radius: 0 0 6px 6px; padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-height: 110px; }
.tile strong { font-size: 17px; }
.drow { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--sp-border); background: transparent; padding: 12px 4px; text-align: left; cursor: pointer; min-height: 48px; }
.drow:hover { background: var(--sp-select); }
.drow .name { flex: 1; font-weight: 600; }
.card { background: var(--sp-panel); border: 1px solid var(--sp-border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.dashed { border-style: dashed; flex-direction: row; flex-wrap: wrap; align-items: center; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.av:not([class*="fill-"]) { background: var(--sp-tint-1); color: var(--sp-accent); }
.tag { border: 1px solid var(--sp-border); border-radius: 6px; padding: 1px 8px; color: var(--sp-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
/* Presence: a circle that expands leftward over the title on hover or focus, without moving anything. */
.presence { position: relative; width: 32px; height: 32px; flex: none; }
.pchip { position: absolute; top: 0; right: 0; height: 32px; max-width: 32px; display: flex; align-items: center; justify-content: flex-end; border: 0; border-radius: 16px; padding: 0; overflow: hidden; white-space: nowrap; cursor: pointer; z-index: 6; font-weight: 700; font-size: 14px; box-shadow: 0 0 0 2px var(--sp-bg); transition: max-width 0.25s ease, padding 0.25s ease; }
.pchip-name { opacity: 0; transition: opacity 0.15s; }
.pchip-name .where { font-weight: 600; opacity: 0.85; }
.pchip-icon { flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.pchip:hover, .pchip:focus-visible { max-width: 280px; padding-left: 12px; }
.pchip:hover .pchip-name, .pchip:focus-visible .pchip-name { opacity: 1; }
.av .i { stroke-width: 2; }
.error { margin: 0; flex-basis: 100%; color: var(--sp-accent-2); font-weight: 600; }
.title-inp { border-color: transparent; background: transparent; font-weight: 700; font-size: 19px; width: 100%; padding: 0 6px; }
.toolbar { position: relative; }
.swatch-btn { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--sp-border); }
.palette { position: absolute; top: 46px; left: 88px; z-index: 5; gap: 8px; width: max-content; max-width: calc(100vw - 40px); }
.palette-grid { display: grid; grid-template-columns: repeat(8, 62px); gap: 10px 6px; }
.pcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pcol .name { font-size: 11px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
.swatch { width: 100%; height: 36px; border: 1px solid var(--sp-border); border-radius: 6px; cursor: pointer; font-weight: 700; }
.fbar { display: flex; align-items: center; gap: 8px; border: 1px solid var(--sp-border); border-radius: 6px; background: var(--sp-panel); padding: 0 0 0 10px; }
.fbar input { flex: 1; border: 0; border-left: 1px solid var(--sp-border); background: transparent; min-height: 36px; padding: 0 10px; outline: none; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.gridbox { overflow: auto; border: 1px solid var(--sp-border); border-radius: 6px; flex: 1; min-height: 300px; outline: none; }
.gridbox:focus-visible { outline: 2px solid var(--sp-accent); }
.grid { display: grid; grid-template-columns: 44px repeat(8, 112px); width: max-content; user-select: none; }
.hcell { background: var(--sp-header); color: var(--sp-muted); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; height: 30px; border-right: 1px solid var(--sp-border); border-bottom: 1px solid var(--sp-border); position: sticky; top: 0; z-index: 2; }
.cell { height: 30px; padding: 0 8px; display: flex; align-items: center; position: relative; border-right: 1px solid var(--sp-border); border-bottom: 1px solid var(--sp-border); white-space: nowrap; overflow: hidden; cursor: cell; font-size: 14px; }
.cell:not([class*="fill-"]) { background: var(--sp-panel); }
.cell.num { justify-content: flex-end; }
.cell.b { font-weight: 700; }
.cell.it { font-style: italic; }
.cell.inr { box-shadow: inset 0 0 0 100px var(--sp-select); }
.cell.peer { outline: 2px solid var(--peer); outline-offset: -2px; }
.cell.sel { outline: 2px solid var(--sp-accent); outline-offset: -2px; z-index: 1; }
.cell input { width: 100%; border: 0; background: transparent; outline: none; padding: 0; text-align: inherit; }
.cell .av { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; }
.cell.num .av { right: auto; left: 3px; }
.cell.ping { animation: ping 0.9s ease-out; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--peer); } 100% { box-shadow: 0 0 0 10px transparent; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.colours { display: grid; grid-template-columns: repeat(8, 44px); gap: 10px; }
.colour { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.colour[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sp-panel), 0 0 0 5px var(--sp-text); }
.iconpick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 320px; overflow: auto; padding: 2px; }
.iconpick-grid button { border: 1px solid var(--sp-border); background: var(--sp-panel); border-radius: 6px; min-height: 76px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--sp-muted); }
.iconpick-grid button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconpick-grid button[aria-pressed="true"] { border-color: var(--sp-accent); background: var(--sp-tint-1); color: var(--sp-text); }
.iconpick-grid .i { color: var(--sp-text); }
.link { border: 0; background: none; color: var(--sp-accent); font-weight: 700; cursor: pointer; padding: 6px 0; align-self: flex-start; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--sp-text); color: var(--sp-bg); padding: 10px 16px; border-radius: 6px; font-weight: 600; z-index: 10; }
@media (max-width: 640px) {
  .colours { grid-template-columns: repeat(8, minmax(0, 44px)); gap: 6px; }
  .colour { width: 100%; height: auto; aspect-ratio: 1; }
  /* Stack as a column so spare height goes to the content, not the rail. */
  .app { flex-direction: column; flex-wrap: nowrap; }
  .rail { flex: none; flex-direction: row; padding: 8px 12px; position: static; height: auto; }
  .main { flex: 1 0 auto; }
  .rail .logo { margin: 0 8px 0 0; }
  .main, .main.sheet { padding: 16px; height: auto; }
  .palette { left: 0; }
  .palette-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sheethead { flex-wrap: nowrap; gap: 8px; }
  .sheethead .title-inp { font-size: 17px; }
  .search { flex: 1 1 100%; }
  .drow .folder { display: none; }
  .drow .mu { min-width: 0 !important; }
  .grid { grid-template-columns: 36px repeat(8, 84px); }
  .hint { display: none; }
  /* The rail is a top bar here, so labels drop below; the right-hand buttons anchor right. */
  .rb[data-tip]::after { left: 50%; top: calc(100% + 8px); transform: translate(-50%, -4px); }
  .rb[data-tip]:hover::after, .rb[data-tip]:focus-visible::after { transform: translate(-50%, 0); }
  .grow ~ .rb[data-tip]::after { left: auto; right: 0; transform: translate(0, -4px); }
  .grow ~ .rb[data-tip]:hover::after, .grow ~ .rb[data-tip]:focus-visible::after { transform: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@1.44.0/dist/umd/lucide.min.js" crossorigin></script>
<script type="text/babel" data-presets="typescript,react" data-plugins="" src="gem-rail-mockup.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinel gem rail mockup</title>
<!--
  Reference mockup for SPN-027 (direction C, "gem rail"). No build step: React,
  Babel and Lucide load from a CDN. State resets on refresh. Serve docs/ so the
  icon picker can read ../reference/icons/ (without it, it offers a short list):
    python3 -m http.server 8765 --directory docs   # then open /design/gem-rail-mockup.html
  SPN-027 deletes docs/design/ once the real theme and screens land.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--sp-bg); color: var(--sp-text); font-family: Nunito, ui-rounded, system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
button, input { font: inherit; color: inherit; }
.app { display: flex; flex-wrap: wrap; min-height: 100vh; position: relative; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.rail { flex: 0 0 64px; background: var(--sp-rail); color: var(--sp-rail-ink); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; }
.rail .logo { display: flex; margin-bottom: 10px; }
.rb { position: relative; width: 44px; height: 44px; border: 0; border-radius: 6px; background: transparent; color: var(--sp-rail-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.rb.on { background: var(--sp-rail-ink); color: var(--sp-rail); }
/* Rail labels: shown on hover and keyboard focus, floating over the page so nothing moves. */
.rb[data-tip]::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translate(-4px, -50%); background: var(--sp-text); color: var(--sp-bg); font-size: 13px; font-weight: 700; white-space: nowrap; padding: 6px 10px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity 0.12s, transform 0.12s; z-index: 30; }
.rb[data-tip]:hover::after, .rb[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); }
.grow { flex: 1; }
.main { flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
.main.sheet { padding: 16px 20px; gap: 10px; height: 100vh; }
h1 { margin: 0; font-size: 26px; font-weight: 700; }
.btn { border: 1px solid var(--sp-border); background: var(--sp-panel); border-radius: 6px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.btn.pri { background: var(--sp-accent); border-color: var(--sp-accent); color: var(--sp-on-accent); font-weight: 700; }
.btn.sq { width: 40px; padding: 0; justify-content: center; }
.btn[aria-pressed="true"] { background: var(--sp-tint-1); border-color: var(--sp-accent); }
.chip { border: 1px solid var(--sp-border); background: transparent; border-radius: 6px; padding: 0 12px; min-height: 36px; cursor: pointer; color: var(--sp-muted); }
.chip.on { background: var(--sp-accent); border-color: var(--sp-accent); color: var(--sp-on-accent); }
.inp { border: 1px solid var(--sp-border); background: var(--sp-panel); border-radius: 6px; min-height: 40px; padding: 0 12px; }
:focus-visible { outline: 2px solid var(--sp-accent); outline-offset: 1px; }
.mu { color: var(--sp-muted); }
.small { font-size: 13px; }
.label { font-size: 13px; font-weight: 700; color: var(--sp-muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tile { flex: 1 1 220px; border: 0; border-top: 4px solid var(--sp-accent); border-radius: 0 0 6px 6px; padding: 18px; text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-height: 110px; }
.tile strong { font-size: 17px; }
.drow { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-bottom: 1px solid var(--sp-border); background: transparent; padding: 12px 4px; text-align: left; cursor: pointer; min-height: 48px; }
.drow:hover { background: var(--sp-select); }
.drow .name { flex: 1; font-weight: 600; }
.card { background: var(--sp-panel); border: 1px solid var(--sp-border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.dashed { border-style: dashed; flex-direction: row; flex-wrap: wrap; align-items: center; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.av { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.av:not([class*="fill-"]) { background: var(--sp-tint-1); color: var(--sp-accent); }
.tag { border: 1px solid var(--sp-border); border-radius: 6px; padding: 1px 8px; color: var(--sp-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
/* Presence: a circle that expands leftward over the title on hover or focus, without moving anything. */
.presence { position: relative; width: 32px; height: 32px; flex: none; }
.pchip { position: absolute; top: 0; right: 0; height: 32px; max-width: 32px; display: flex; align-items: center; justify-content: flex-end; border: 0; border-radius: 16px; padding: 0; overflow: hidden; white-space: nowrap; cursor: pointer; z-index: 6; font-weight: 700; font-size: 14px; box-shadow: 0 0 0 2px var(--sp-bg); transition: max-width 0.25s ease, padding 0.25s ease; }
.pchip-name { opacity: 0; transition: opacity 0.15s; }
.pchip-name .where { font-weight: 600; opacity: 0.85; }
.pchip-icon { flex: none; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.pchip:hover, .pchip:focus-visible { max-width: 280px; padding-left: 12px; }
.pchip:hover .pchip-name, .pchip:focus-visible .pchip-name { opacity: 1; }
.av .i { stroke-width: 2; }
.error { margin: 0; flex-basis: 100%; color: var(--sp-accent-2); font-weight: 600; }
.title-inp { border-color: transparent; background: transparent; font-weight: 700; font-size: 19px; width: 100%; padding: 0 6px; }
.toolbar { position: relative; }
.swatch-btn { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--sp-border); }
.palette { position: absolute; top: 46px; left: 88px; z-index: 5; gap: 8px; width: max-content; max-width: calc(100vw - 40px); }
.palette-grid { display: grid; grid-template-columns: repeat(8, 62px); gap: 10px 6px; }
.pcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pcol .name { font-size: 11px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
.swatch { width: 100%; height: 36px; border: 1px solid var(--sp-border); border-radius: 6px; cursor: pointer; font-weight: 700; }
.fbar { display: flex; align-items: center; gap: 8px; border: 1px solid var(--sp-border); border-radius: 6px; background: var(--sp-panel); padding: 0 0 0 10px; }
.fbar input { flex: 1; border: 0; border-left: 1px solid var(--sp-border); background: transparent; min-height: 36px; padding: 0 10px; outline: none; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.gridbox { overflow: auto; border: 1px solid var(--sp-border); border-radius: 6px; flex: 1; min-height: 300px; outline: none; }
.gridbox:focus-visible { outline: 2px solid var(--sp-accent); }
.grid { display: grid; grid-template-columns: 44px repeat(8, 112px); width: max-content; user-select: none; }
.hcell { background: var(--sp-header); color: var(--sp-muted); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; height: 30px; border-right: 1px solid var(--sp-border); border-bottom: 1px solid var(--sp-border); position: sticky; top: 0; z-index: 2; }
.cell { height: 30px; padding: 0 8px; display: flex; align-items: center; position: relative; border-right: 1px solid var(--sp-border); border-bottom: 1px solid var(--sp-border); white-space: nowrap; overflow: hidden; cursor: cell; font-size: 14px; }
.cell:not([class*="fill-"]) { background: var(--sp-panel); }
.cell.num { justify-content: flex-end; }
.cell.b { font-weight: 700; }
.cell.it { font-style: italic; }
.cell.inr { box-shadow: inset 0 0 0 100px var(--sp-select); }
.cell.peer { outline: 2px solid var(--peer); outline-offset: -2px; }
.cell.sel { outline: 2px solid var(--sp-accent); outline-offset: -2px; z-index: 1; }
.cell input { width: 100%; border: 0; background: transparent; outline: none; padding: 0; text-align: inherit; }
.cell .av { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; }
.cell.num .av { right: auto; left: 3px; }
.cell.ping { animation: ping 0.9s ease-out; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--peer); } 100% { box-shadow: 0 0 0 10px transparent; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.colours { display: grid; grid-template-columns: repeat(8, 44px); gap: 10px; }
.colour { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.colour[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sp-panel), 0 0 0 5px var(--sp-text); }
.iconpick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 320px; overflow: auto; padding: 2px; }
.iconpick-grid button { border: 1px solid var(--sp-border); background: var(--sp-panel); border-radius: 6px; min-height: 76px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--sp-muted); }
.iconpick-grid button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconpick-grid button[aria-pressed="true"] { border-color: var(--sp-accent); background: var(--sp-tint-1); color: var(--sp-text); }
.iconpick-grid .i { color: var(--sp-text); }
.link { border: 0; background: none; color: var(--sp-accent); font-weight: 700; cursor: pointer; padding: 6px 0; align-self: flex-start; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--sp-text); color: var(--sp-bg); padding: 10px 16px; border-radius: 6px; font-weight: 600; z-index: 10; }
@media (max-width: 640px) {
  .colours { grid-template-columns: repeat(8, minmax(0, 44px)); gap: 6px; }
  .colour { width: 100%; height: auto; aspect-ratio: 1; }
  /* Stack as a column so spare height goes to the content, not the rail. */
  .app { flex-direction: column; flex-wrap: nowrap; }
  .rail { flex: none; flex-direction: row; padding: 8px 12px; }
  .main { flex: 1 0 auto; }
  .rail .logo { margin: 0 8px 0 0; }
  .main, .main.sheet { padding: 16px; height: auto; }
  .palette { left: 0; }
  .palette-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sheethead { flex-wrap: nowrap; gap: 8px; }
  .sheethead .title-inp { font-size: 17px; }
  .search { flex: 1 1 100%; }
  .drow .folder { display: none; }
  .drow .mu { min-width: 0 !important; }
  .grid { grid-template-columns: 36px repeat(8, 84px); }
  .hint { display: none; }
  /* The rail is a top bar here, so labels drop below; the right-hand buttons anchor right. */
  .rb[data-tip]::after { left: 50%; top: calc(100% + 8px); transform: translate(-50%, -4px); }
  .rb[data-tip]:hover::after, .rb[data-tip]:focus-visible::after { transform: translate(-50%, 0); }
  .grow ~ .rb[data-tip]::after { left: auto; right: 0; transform: translate(0, -4px); }
  .grow ~ .rb[data-tip]:hover::after, .grow ~ .rb[data-tip]:focus-visible::after { transform: none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@1.44.0/dist/umd/lucide.min.js" crossorigin></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- Data ----------
const COLS = 8, ROWS = 16, LETTERS = 'ABCDEFGH';
const PRESETS = ['primary', 'secondary', 'success', 'warning', 'error', 'info', 'neutral', 'highlight'];
const PRESET_NAMES = ['Primary', 'Secondary', 'Success', 'Warning', 'Error', 'Info', 'Neutral', 'Highlight'];
const ref = (r, c) => LETTERS[c] + (r + 1);
const key = (r, c) => r + ',' + c;

function budgetCells() {
  const rows = [
    ['Month', 'Rent', 'Food', 'Fun', 'Total'],
    ['Jan', '1800', '420', '150', '=SUM(B2:D2)'],
    ['Feb', '1800', '385', '90', '=SUM(B3:D3)'],
    ['Mar', '1800', '460', '210', '=SUM(B4:D4)'],
    ['Apr', '1800', '410', '120', '=SUM(B5:D5)'],
    ['Total', '=SUM(B2:B5)', '=SUM(C2:C5)', '=SUM(D2:D5)', '=SUM(E2:E5)'],
  ];
  const cells = {};
  rows.forEach((row, r) => row.forEach((v, c) => { cells[key(r, c)] = { v }; }));
  for (let c = 0; c < 5; c++) {
    Object.assign(cells[key(0, c)], { b: true, f: 'primary-soft' });
    Object.assign(cells[key(5, c)], { b: true, f: 'neutral-soft' });
  }
  cells[key(3, 2)].f = 'error-soft';
  cells[key(2, 3)].f = 'success-soft';
  cells[key(5, 4)].f = 'primary-strong';
  cells[key(7, 0)] = { v: 'Food over 450 is flagged', i: true };
  return cells;
}
const blankTab = (name) => ({ name, cells: {} });
const initialDocs = () => [
  { id: 1, name: '2027 budget', type: 'sheet', folder: 'Budgets', edited: '2 hours ago', tabs: [{ name: 'Budget', cells: budgetCells() }, blankTab('Savings')] },
  { id: 2, name: 'Packing list', type: 'doc', folder: 'Trips', edited: 'Yesterday' },
  { id: 3, name: 'Wedding guests', type: 'sheet', folder: 'Shared with you', edited: 'Monday', tabs: [blankTab('Guests')] },
  { id: 4, name: 'Recipe notes', type: 'doc', folder: 'Your docs', edited: 'Last week' },
  { id: 5, name: 'House fund', type: 'sheet', folder: 'Budgets', edited: 'Sep 3', tabs: [blankTab('Fund')] },
];
const ME = 1, PEER = 2; // you, and the other person in the open sheet
const initialUsers = [
  { id: 1, name: 'Baylee', email: 'baylee@example.com', color: 'info-strong', icon: 'sparkles', keys: ['1Password', 'iCloud Keychain'], active: true },
  { id: 2, name: 'Sam Rivera', email: 'sam@example.com', color: 'secondary-strong', icon: 'bird', keys: ['Proton Pass'], active: true },
  { id: 3, name: 'Alex Kim', email: 'alex@example.com', color: 'success-soft', icon: 'sprout', keys: [], active: false },
];
const fmt = (n) => (typeof n === 'number' ? n.toLocaleString(undefined, { maximumFractionDigits: 2 }) : n);

// ---------- Formulas: numbers, cell refs, + - * / ( ) and SUM(A1:B2) ----------
function evaluate(cells, r, c, seen = new Set()) {
  const raw = cells[key(r, c)]?.v ?? '';
  if (raw[0] !== '=') return raw !== '' && !isNaN(Number(raw)) ? Number(raw) : raw;
  const k = key(r, c);
  if (seen.has(k)) return '#CYCLE';
  seen.add(k);
  try { return evalExpr(cells, raw.slice(1).toUpperCase(), seen); }
  catch (e) { return typeof e === 'string' ? e : '#ERR'; }
  finally { seen.delete(k); }
}

function evalExpr(cells, src, seen) {
  const toks = src.match(/[A-H]\d+:[A-H]\d+|[A-H]\d+|\d+(?:\.\d+)?|SUM|[-+*/()]/g) || [];
  if (toks.join('') !== src.replace(/\s+/g, '')) throw 1;
  let i = 0;
  const at = (t) => [Number(t.slice(1)) - 1, LETTERS.indexOf(t[0])];
  const val = (t) => {
    const x = evaluate(cells, ...at(t), seen);
    if (typeof x === 'string' && x[0] === '#') throw x;
    return typeof x === 'number' ? x : 0;
  };
  const prim = () => {
    const t = toks[i++];
    if (t === 'SUM') {
      if (toks[i++] !== '(') throw 1;
      const [a, b = a] = (toks[i++] || '').split(':');
      if (toks[i++] !== ')' || !/^[A-H]\d+$/.test(a)) throw 1;
      const [r1, c1] = at(a), [r2, c2] = at(b);
      let sum = 0;
      for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++)
        for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) sum += val(ref(r, c));
      return sum;
    }
    if (t === '(') { const e = add(); if (toks[i++] !== ')') throw 1; return e; }
    if (t === '-') return -prim();
    if (/^[A-H]\d+$/.test(t ?? '')) return val(t);
    if (t != null && !isNaN(Number(t))) return Number(t);
    throw 1;
  };
  const mul = () => { let a = prim(); while (toks[i] === '*' || toks[i] === '/') { const o = toks[i++], b = prim(); a = o === '*' ? a * b : a / b; } return a; };
  const add = () => { let a = mul(); while (toks[i] === '+' || toks[i] === '-') { const o = toks[i++], b = mul(); a = o === '+' ? a + b : a - b; } return a; };
  const out = add();
  if (i < toks.length) throw 1;
  return out;
}

// ---------- Icons (inline stroke SVG) ----------
const ICONS = {
  folder: <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />,
  sheet: <><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 10h18M9 4v16" /></>,
  doc: <><path d="M7 3h7l5 5v13H7z" /><path d="M14 3v5h5M10 13h6M10 17h6" /></>,
  users: <><circle cx="9" cy="8" r="3" /><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6" /></>,
  moon: <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />,
  sun: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5" /></>,
  search: <><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></>,
  mail: <><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></>,
  key: <><circle cx="8" cy="15" r="4" /><path d="M11 12l9-9M17 6l3 3" /></>,
  back: <path d="M19 12H5M11 6l-6 6 6 6" />,
  fill: <><path d="M5 11l7-7 7 7-7 7z" /><path d="M19 15s2 2.5 2 4a2 2 0 0 1-4 0c0-1.5 2-4 2-4z" /></>,
};
function Icon({ name, className = '', style, label }) {
  return (
    <svg className={'i ' + className} viewBox="0 0 24 24" style={style} aria-hidden={label ? undefined : true} role={label ? 'img' : undefined} aria-label={label}>
      {ICONS[name]}
    </svg>
  );
}

// ---------- Logo: a faceted heart, drawn point-down; theme.css flips it in dark ----------
const HEART = 'M50 27C44 13 31 6 20 9 8 12 2 24 4 37 7 56 29 76 50 94 71 76 93 56 96 37 98 24 92 12 80 9 69 6 56 13 50 27Z';
const GEM_POINTS = {
  A: [23, 33], B: [77, 33], D: [50, 80], K1: [50, 22], K2: [34, 12], K3: [66, 12], K4: [7, 30], K5: [93, 30],
  K6: [15, 60], K7: [85, 60], K8: [38, 85], K9: [62, 85], P: [50, 94],
  TL: [20, -10], T: [50, -10], TR: [80, -10], L1: [-10, 20], L2: [-10, 62], R1: [110, 20], R2: [110, 62], BOT: [50, 110],
};
// Each facet: its corners and a tone from 1 (darkest) to 6 (lightest). Outer facets overshoot and are clipped to HEART.
const GEM_FACETS = [
  ['TL T K1 K2', 3], ['T TR K3 K1', 2], ['TL K2 K4 L1', 3], ['TR R1 K5 K3', 2],
  ['L1 K4 K6 L2', 4], ['L2 K6 K8 P BOT', 3], ['R1 R2 K7 K5', 2], ['R2 BOT P K9 K7', 1],
  ['A K2 K1', 4], ['K1 K3 B', 3], ['A K1 B', 2], ['K4 K2 A', 5], ['B K3 K5', 2],
  ['K4 A K6', 6], ['K6 A D', 5], ['K6 D K8', 3], ['K5 K7 B', 3], ['K7 D B', 1], ['K7 K9 D', 2],
  ['K8 D P', 2], ['D K9 P', 1], ['A B D', 4],
].map(([corners, tone]) => ({ d: 'M' + corners.split(' ').map((n) => GEM_POINTS[n].join(' ')).join('L') + 'Z', tone }));

function GemLogo({ size = 36 }) {
  const clip = React.useId();
  return (
    <svg className="gem" width={size} height={size} viewBox="0 0 100 100" role="img" aria-label="Spinel">
      <defs><clipPath id={clip}><path d={HEART} /></clipPath></defs>
      <g clipPath={`url(#${clip})`} strokeWidth="0.6" strokeLinejoin="round">
        {GEM_FACETS.map((f, n) => <path key={n} d={f.d} fill={`var(--gem-${f.tone})`} stroke={`var(--gem-${f.tone})`} />)}
      </g>
      <path d={HEART} fill="none" stroke="var(--gem-edge)" strokeWidth="3.2" strokeLinejoin="round" />
    </svg>
  );
}

// ---------- People: a profile colour (any of the 16 fill presets) and a Lucide icon ----------
// Primary and error are left out: they already mean "you" and "a problem".
// Same order as the cell palette: strong on the first row, soft below.
const AVATAR_COLOURS = ['strong', 'soft'].flatMap((shade) => PRESETS.map((role, i) => ({ id: `${role}-${shade}`, name: `${PRESET_NAMES[i]}, ${shade}` })));

const pascal = (name) => name.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join('');
function LucideIcon({ name, size = 18 }) {
  const node = window.lucide?.icons[pascal(name)] || window.lucide?.icons.UserRound || [];
  return (
    <svg className="i" viewBox="0 0 24 24" aria-hidden="true" style={{ width: size, height: size }}>
      {node.map(([tag, attrs], n) => React.createElement(tag, { key: n, ...attrs }))}
    </svg>
  );
}
function Avatar({ user, size = 36, label, decorative }) {
  const a11y = decorative ? { 'aria-hidden': true } : { role: 'img', 'aria-label': label ?? user.name, title: label ?? user.name };
  return (
    <span className={`av fill-${user.color}`} style={{ width: size, height: size }} {...a11y}>

}

// ---------- Icon search: a port of docs/reference/icons/person-icon-search.ts ----------
// It ranks names over Lucide's tags. The reference also folds in local synonyms
// ("lotus", "doctor"); this mockup skips those.
const FALLBACK_ICONS = ['user-round', 'sparkles', 'bird', 'sprout', 'cat', 'dog', 'heart', 'star', 'moon', 'sun', 'flower', 'flower-2', 'crown', 'cookie', 'coffee', 'music', 'rocket', 'ghost', 'gem', 'leaf', 'rabbit', 'fish', 'turtle', 'snail']
  .map((name) => ({ name, tags: [], categories: [] }));
const words = (text) => text.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
const labelFor = (name) => name.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
function buildCatalog(icons) {
  // The reference's ICON_SEARCH_ALIASES: old names for another icon, shown once under the new name.
  const aliases = new Set(['alarm-check', 'alarm-minus', 'alarm-plus']);
  return icons.filter((icon) => !aliases.has(icon.name) && window.lucide?.icons[pascal(icon.name)]).map((icon) => {
    const found = new Map();
    for (const [text, priority] of [[icon.name, 40], [[...icon.tags, ...icon.categories].join(' '), 20]])
      for (const w of words(text)) found.set(w, Math.max(found.get(w) ?? 0, priority));
    return { ...icon, label: labelFor(icon.name), words: [...found] };
  });
}
function distance(a, b) {
  const rows = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) rows[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++) {
      rows[i][j] = Math.min(rows[i - 1][j] + 1, rows[i][j - 1] + 1, rows[i - 1][j - 1] + Number(a[i - 1] !== b[j - 1]));
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) rows[i][j] = Math.min(rows[i][j], rows[i - 2][j - 2] + 1);
    }
  return rows[a.length][b.length];
}
function searchIcons(catalog, query, category) {
  const tokens = words(query).slice(0, 8);
  const pool = catalog.filter((icon) => category === 'All' || icon.categories.includes(category));
  if (query.trim() && !tokens.length) return [];
  if (!tokens.length) return pool;
  return pool.map((icon) => {
    let score = 0;
    for (const t of tokens) {
      let best = 0;
      for (const [w, pr] of icon.words) {
        if (w === t) best = Math.max(best, 100 + pr);
        else if (w.startsWith(t)) best = Math.max(best, 70 + pr);
        else if (t.length >= 3 && w.includes(t)) best = Math.max(best, 40 + pr);
        else if (t.length >= 4 && Math.abs(t.length - w.length) <= (t.length >= 8 ? 2 : 1)) {
          const d = distance(t, w);
          if (d <= (t.length >= 8 ? 2 : 1)) best = Math.max(best, 25 - d * 5 + pr);
        }
      }
      if (!best) return { icon, score: 0 };
      score += best;
    }
    if (tokens.join('-') === icon.name) score += 200;
    return { icon, score };
  }).filter((m) => m.score > 0).sort((a, b) => b.score - a.score || a.icon.name.localeCompare(b.icon.name)).map((m) => m.icon);
}
function useIconCatalog() {
  const [catalog, setCatalog] = useState(() => buildCatalog(FALLBACK_ICONS));
  const [full, setFull] = useState(false);
  useEffect(() => {
    fetch('../reference/icons/person-icon-catalog.json')
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((data) => { setCatalog(buildCatalog(data.icons)); setFull(true); })
      .catch(() => {});
  }, []);
  return [catalog, full];
}

function IconPicker({ value, onChange }) {
  const [catalog, full] = useIconCatalog();
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('All');
  const [limit, setLimit] = useState(60);
  const grid = useRef();
  const categories = useMemo(() => [...new Set(catalog.flatMap((i) => i.categories))].sort(), [catalog]);
  const matches = useMemo(() => searchIcons(catalog, query, category), [catalog, query, category]);
  const shown = matches.slice(0, limit);
  useEffect(() => { setLimit(60); if (grid.current) grid.current.scrollTop = 0; }, [query, category]);
  const move = (e, n) => {
    const buttons = [...grid.current.querySelectorAll('button')];
    const cols = getComputedStyle(grid.current).gridTemplateColumns.split(' ').length;
    const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    if (step === undefined && e.key !== 'Home' && e.key !== 'End') return;
    e.preventDefault();
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? buttons.length - 1 : Math.max(0, Math.min(buttons.length - 1, n + step));
    buttons[next]?.focus();
  };
  return (
    <div className="field">
      <span className="label">Icon</span>
      <div className="row" style={{ gap: 8 }}>
        <label className="inp row search" style={{ gap: 8, flex: '1 1 220px' }}>
          <Icon name="search" className="mu" />
          <input aria-label="Search icons" placeholder="Search icons, like bird or flowre" value={query} onChange={(e) => setQuery(e.target.value)}
            style={{ border: 0, background: 'transparent', outline: 'none', minHeight: 38, flex: 1, minWidth: 0 }}
            onKeyDown={(e) => {
              if (e.key === 'ArrowDown') { e.preventDefault(); grid.current?.querySelector('button')?.focus(); }
              if (e.key === 'Enter' && matches.length === 1) { e.preventDefault(); onChange(matches[0].name); }
            }} />
        </label>
        {categories.length > 0 && (
          <select className="inp" aria-label="Icon category" value={category} onChange={(e) => setCategory(e.target.value)}>
            <option>All</option>
            {categories.map((c) => <option key={c} value={c}>{c[0].toUpperCase() + c.slice(1)}</option>)}
          </select>
        )}
      </div>
      <p className="mu small" role="status" style={{ margin: 0 }}>
        {matches.length} {matches.length === 1 ? 'icon' : 'icons'}{full ? '' : ' (short list: serve docs/ to load all of Lucide)'}
      </p>
      <div className="iconpick-grid" ref={grid} role="group" aria-label="Icon results">
        {shown.map((icon, n) => (
          <button key={icon.name} type="button" aria-pressed={icon.name === value} aria-label={icon.label} title={[icon.label, ...icon.tags].join(' · ')}
            onClick={() => onChange(icon.name)} onKeyDown={(e) => move(e, n)}>
            <LucideIcon name={icon.name} size={24} /><span>{icon.label}</span>
          </button>
        ))}
      </div>
      {matches.length > limit && <button type="button" className="link" onClick={() => setLimit((l) => l + 60)}>Show more icons ({limit} of {matches.length})</button>}
      {!matches.length && <p className="mu" style={{ margin: 0 }}>No icons match. Try another name or description.</p>}
    </div>
  );
}

// ---------- Open spreadsheet ----------
const MOVES = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
const clamp = (r, c) => [Math.max(0, Math.min(ROWS - 1, r)), Math.max(0, Math.min(COLS - 1, c))];

function Sheet({ doc, peer, updateDoc, back, say }) {
  const [tab, setTab] = useState(0);
  const [anchor, setAnchor] = useState([1, 1]);
  const [focus, setFocus] = useState([1, 1]);
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState('');
  const [palette, setPalette] = useState(false);
  const [lastFill, setLastFill] = useState('primary-soft');
  const [history, setHistory] = useState([]);
  const [sam, setSam] = useState([3, 2]);
  const [ping, setPing] = useState(false);
  const dragging = useRef(false);
  const editingRef = useRef(false);
  const gridRef = useRef();

  const cells = doc.tabs[tab].cells;
  const raw = (r, c) => cells[key(r, c)]?.v ?? '';
  const [fr, fc] = focus;
  const r1 = Math.min(anchor[0], fr), r2 = Math.max(anchor[0], fr), c1 = Math.min(anchor[1], fc), c2 = Math.max(anchor[1], fc);
  const inRange = (r, c) => r >= r1 && r <= r2 && c >= c1 && c <= c2;

  useEffect(() => { if (!editing) setDraft(raw(fr, fc)); }, [fr, fc, tab, doc]);
  useEffect(() => {
    const t = setInterval(() => setSam([1 + Math.floor(Math.random() * 12), 1 + Math.floor(Math.random() * 6)]), 3500);
    const up = () => { dragging.current = false; };
    window.addEventListener('mouseup', up);
    return () => { clearInterval(t); window.removeEventListener('mouseup', up); };
  }, []);

  const mutate = (fn) => {
    const tabs = structuredClone(doc.tabs);
    fn(tabs[tab].cells);
    setHistory((h) => [...h.slice(-29), doc.tabs]);
    updateDoc(() => ({ tabs }));
  };
  const eachInRange = (cs, fn) => {
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) fn((cs[key(r, c)] ??= { v: '' }));
  };
  const select = (r, c, extend) => {
    [r, c] = clamp(r, c);
    setFocus([r, c]);
    if (!extend) setAnchor([r, c]);
  };
  // Clicking someone's presence circle selects their cell and scrolls it into view.
  const jumpTo = ([r, c]) => {
    if (editingRef.current) commit();
    select(r, c);
    setPing(true);
    setTimeout(() => setPing(false), 900);
    requestAnimationFrame(() => {
      gridRef.current?.querySelector(`[data-cell="${r},${c}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      gridRef.current?.focus({ preventScroll: true });
    });
  };
  const startEdit = (initial) => { editingRef.current = true; setEditing(true); setDraft(initial); };
  const commit = (move) => {
    if (!editingRef.current && move === undefined) return;
    editingRef.current = false;
    setEditing(false);
    if (draft !== raw(fr, fc)) mutate((cs) => { cs[key(fr, fc)] = { ...cs[key(fr, fc)], v: draft }; });
    if (move === 'down') select(fr + 1, fc);
    if (move === 'right') select(fr, fc + 1);
    gridRef.current?.focus();
  };
  const cancel = () => { editingRef.current = false; setEditing(false); setDraft(raw(fr, fc)); gridRef.current?.focus(); };

  let sum = 0, count = 0, allBold = true, allItalic = true;
  for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) {
    const x = evaluate(cells, r, c);
    if (typeof x === 'number') { sum += x; count++; }
    if (!cells[key(r, c)]?.b) allBold = false;
    if (!cells[key(r, c)]?.i) allItalic = false;
  }
  const toggleBold = () => mutate((cs) => eachInRange(cs, (x) => { x.b = !allBold; }));
  const toggleItalic = () => mutate((cs) => eachInRange(cs, (x) => { x.i = !allItalic; }));
  const applyFill = (f) => { mutate((cs) => eachInRange(cs, (x) => { if (f) x.f = f; else delete x.f; })); if (f) setLastFill(f); setPalette(false); gridRef.current?.focus(); };
  const undo = () => {
    if (!history.length) return say('Nothing to undo');
    updateDoc(() => ({ tabs: history[history.length - 1] }));
    setHistory((h) => h.slice(0, -1));
  };

  const onGridKey = (e) => {
    if (e.target.tagName === 'INPUT') return;
    const mod = e.metaKey || e.ctrlKey, k = e.key;
    if (mod && k.toLowerCase() === 'b') { e.preventDefault(); return toggleBold(); }
    if (mod && k.toLowerCase() === 'i') { e.preventDefault(); return toggleItalic(); }
    if (mod && k.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
    if (MOVES[k]) { e.preventDefault(); return select(fr + MOVES[k][0], fc + MOVES[k][1], e.shiftKey); }
    if (k === 'Enter' || k === 'F2') { e.preventDefault(); return startEdit(raw(fr, fc)); }
    if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); return mutate((cs) => eachInRange(cs, (x) => { x.v = ''; })); }
    if (k === 'Escape') return setPalette(false);
    if (k.length === 1 && !mod) { e.preventDefault(); startEdit(k); }
  };
  const onEditKey = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit('down'); }
    else if (e.key === 'Tab') { e.preventDefault(); commit('right'); }
    else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  };
  const addTab = () => {
    updateDoc((d) => ({ tabs: [...d.tabs, blankTab('Sheet ' + (d.tabs.length + 1))] }));
    setTab(doc.tabs.length); setAnchor([0, 0]); setFocus([0, 0]); setHistory([]);
  };
  const pickTab = (n) => { setTab(n); setAnchor([0, 0]); setFocus([0, 0]); setHistory([]); setEditing(false); editingRef.current = false; };
  const selRef = r1 === r2 && c1 === c2 ? ref(fr, fc) : ref(r1, c1) + ':' + ref(r2, c2);

  return (
    <main className="main sheet">
      <div className="row sheethead">
        <button className="btn sq" onClick={back} aria-label="Back to your docs"><Icon name="back" /></button>
        <div style={{ flex: '1 1 0', minWidth: 0 }}>
          <input className="inp title-inp" aria-label="Document name" value={doc.name} onChange={(e) => updateDoc(() => ({ name: e.target.value }))} />
          <div className="mu small" style={{ padding: '0 7px' }}>{doc.folder} · Saved</div>
        </div>
        <div className="presence">
          <button className={`pchip fill-${peer.color}`} onClick={() => jumpTo(sam)} aria-label={`${peer.name} is in ${ref(...sam)}. Go to their cell`}>
            <span className="pchip-name">{peer.name} <span className="where">· {ref(...sam)}</span></span>
            <span className="pchip-icon"><LucideIcon name={peer.icon} size={18} /></span>
          </button>
        </div>
        <button className="btn pri" onClick={() => say('Sharing with specific people comes in SPN-015')}>Share</button>
      </div>

      <div className="row toolbar" style={{ gap: 6 }} role="toolbar" aria-label="Formatting">
        <button className="btn sq" style={{ fontWeight: 700 }} aria-label="Bold" aria-pressed={allBold} onClick={toggleBold}>B</button>
        <button className="btn sq" style={{ fontStyle: 'italic' }} aria-label="Italic" aria-pressed={allItalic} onClick={toggleItalic}>I</button>
        <button className="btn" aria-label="Fill colour" aria-expanded={palette} onClick={() => setPalette(!palette)}><Icon name="fill" /><span className={'swatch-btn fill-' + lastFill} /></button>
        <button className="btn" onClick={undo}>Undo</button>
        <span className="mu small" style={{ marginLeft: 'auto' }}>{count > 1 ? `Sum ${fmt(sum)} · Count ${count}` : ''}</span>
        {palette && (
          <div className="card palette" role="dialog" aria-label="Fill colours">
            <div className="palette-grid">
              {PRESETS.map((p, n) => (
                <div key={p} className="pcol">
                  <span className="mu name">{PRESET_NAMES[n]}</span>
                  {['soft', 'strong'].map((kind) => (
                    <button key={kind} className={`swatch fill-${p}-${kind}`} aria-label={`${PRESET_NAMES[n]}, ${kind}`} title={`${PRESET_NAMES[n]}, ${kind}`} onClick={() => applyFill(`${p}-${kind}`)}>Aa</button>
                  ))}
                </div>
              ))}
            </div>
            <button className="btn" style={{ alignSelf: 'flex-start' }} onClick={() => applyFill(null)}>No fill</button>
          </div>
        )}
      </div>

      <div className="fbar">
        <span className="mu" style={{ fontWeight: 700, minWidth: 36 }}>{selRef}</span>
        <input aria-label="Cell contents" value={draft} onChange={(e) => { editingRef.current = true; setDraft(e.target.value); }}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit('down'); } else if (e.key === 'Escape') cancel(); }} />
      </div>

      <div className="gridbox" role="grid" aria-label="Spreadsheet" tabIndex={0} ref={gridRef} onKeyDown={onGridKey}>
        <div className="grid">
          <div className="hcell" />
          {[...LETTERS].map((l) => <div key={l} className="hcell">{l}</div>)}
          {Array.from({ length: ROWS }, (_, r) => (
            <React.Fragment key={r}>
              <div className="hcell" style={{ position: 'static' }}>{r + 1}</div>
              {Array.from({ length: COLS }, (_, c) => {
                const cell = cells[key(r, c)] || {}, val = evaluate(cells, r, c);
                const isFocus = r === fr && c === fc, isEditing = isFocus && editing, isSam = r === sam[0] && c === sam[1];
                const cls = ['cell', typeof val === 'number' && 'num', cell.b && 'b', cell.i && 'it', cell.f && 'fill-' + cell.f, inRange(r, c) && !isFocus && 'inr', isSam && 'peer', isSam && ping && 'ping', isFocus && 'sel'].filter(Boolean).join(' ');
                return (
                  <div key={c} className={cls} role="gridcell" aria-selected={inRange(r, c)} data-cell={r + ',' + c} style={isSam ? { '--peer': `var(--fill-${peer.color}-bg)` } : undefined}
                    onMouseDown={(e) => {
                      e.preventDefault();
                      if (editingRef.current) commit();
                      select(r, c, e.shiftKey);
                      dragging.current = !e.shiftKey;
                      gridRef.current?.focus();
                    }}
                    onMouseEnter={() => { if (dragging.current) setFocus([r, c]); }}
                    onDoubleClick={() => startEdit(raw(r, c))}>
                    {isEditing
                      ? <input autoFocus aria-label="Edit cell" value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={onEditKey} onBlur={() => commit()} />
                      : <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{fmt(val)}</span>}
                    {isSam && <Avatar user={peer} size={18} label={`${peer.name} is here`} />}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="row" style={{ gap: 6 }}>
        {doc.tabs.map((t, n) => <button key={n} className={'chip ' + (n === tab ? 'on' : '')} aria-pressed={n === tab} onClick={() => pickTab(n)}>{t.name}</button>)}
        <button className="chip" onClick={addTab} aria-label="Add a sheet">+</button>
        <span className="mu small hint" style={{ marginLeft: 'auto' }}>Double-click or type to edit. Shift-click or drag to select. Try =SUM(B2:B5) or =B2*12</span>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
